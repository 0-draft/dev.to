name: Publish to dev.to

on:
  push:
    branches:
      - main
    paths:
      - 'articles/**/*.md'
      # A re-rendered diagram changes no markdown, so without this the push
      # never reaches the workflow. See the cache-busting step below.
      - 'articles/assets/**'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which articles to push'
        type: choice
        options:
          - changed
          - all
        default: changed
      reconcile:
        description: 'Adopt existing dev.to articles by title instead of creating new ones'
        type: boolean
        default: false

# Both this workflow and Schedule Publisher commit to main. Sharing one
# concurrency group keeps their pushes from racing into a non-fast-forward.
concurrency:
  group: devto-main-write
  cancel-in-progress: false

env:
  # Pinned: an unpinned global install would silently pick up whatever the
  # registry serves at build time.
  DEVTO_CLI_VERSION: '1.4.0'
  ARTICLE_LIST: articles.nul

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          npm install -g "@sinedied/devto-cli@${DEVTO_CLI_VERSION}"

      - name: Collect articles to push
        id: collect
        env:
          SCOPE: ${{ inputs.scope }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          list="${RUNNER_TEMP}/${ARTICLE_LIST}"

          # ':(glob)' stops '*' from matching '/', so this stays top-level only.
          # articles/TIL/ and any other subdirectory is intentionally not published.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$SCOPE" = "all" ]; then
            git ls-files -z -- ':(glob)articles/*.md' > "$list"
          else
            base="$BEFORE"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              # First push on a branch, or a force-push rewrote history.
              # --verify --quiet stays silent when there is no parent; plain
              # 'rev-parse <sha>^' would echo the unresolvable ref to stdout and
              # exit non-zero, leaving a two-line value that breaks git diff.
              base="$(git rev-parse --verify --quiet "${AFTER}^" || true)"
            fi
            if [ -z "$base" ]; then
              # Root commit: diff against the empty tree, so every article counts as added.
              base="$(git hash-object -t tree /dev/null)"
            fi
            git diff -z --name-only --diff-filter=d "$base" "$AFTER" -- ':(glob)articles/*.md' > "$list"

            # An asset-only change leaves the owning article's markdown byte
            # identical, so devto-cli would skip it and Bunny CDN would keep
            # serving the old image for a year. Rewriting ?v=<content hash> on
            # every reference makes both notice. The script prints the articles
            # it touched; fold them into the batch.
            assets="${RUNNER_TEMP}/assets.nul"
            git diff -z --name-only --diff-filter=d "$base" "$AFTER" -- ':(glob)articles/assets/**' > "$assets"
            if [ -s "$assets" ]; then
              mapfile -d '' -t changed_assets < "$assets"
              python scripts/bump_asset_versions.py "${changed_assets[@]}" > "${RUNNER_TEMP}/bumped.txt"
              # sort -z keeps the union NUL-delimited and drops the articles that
              # are already in the batch from their own markdown edit.
              { cat "$list"; tr '\n' '\0' < "${RUNNER_TEMP}/bumped.txt"; } | sort -z -u > "${list}.union"
              mv "${list}.union" "$list"
            fi
          fi

          files=()
          mapfile -d '' -t files < "$list"
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          echo "Articles to push: ${#files[@]}"
          if [ "${#files[@]}" -gt 0 ]; then
            printf '  %s\n' "${files[@]}"
          fi

      - name: Validate articles
        if: steps.collect.outputs.count != '0'
        run: |
          set -euo pipefail
          mapfile -d '' -t files < "${RUNNER_TEMP}/${ARTICLE_LIST}"
          python scripts/validate_articles.py "${files[@]}"

      - name: Publish articles
        id: publish
        if: steps.collect.outputs.count != '0'
        env:
          # devto-cli reads DEVTO_TOKEN from the environment. Passing the key as
          # an argv flag would expose it to anything that can read /proc on the
          # runner; the env var does not appear in the process table.
          DEVTO_TOKEN: ${{ secrets.DEVTO_API_KEY }}
          RECONCILE: ${{ inputs.reconcile }}
        run: |
          set -euo pipefail
          if [ -z "$DEVTO_TOKEN" ]; then
            echo "::error::DEVTO_API_KEY secret is not set; nothing was published."
            exit 1
          fi
          mapfile -d '' -t files < "${RUNNER_TEMP}/${ARTICLE_LIST}"

          # devto-cli aborts the whole batch if any local `id` is missing from
          # the account behind the token, with only "Cannot find published
          # article on dev.to: <title>". That happens to anyone who forks this
          # repository and keeps the original `id` values. Name the files first.
          python scripts/check_devto_ids.py "${files[@]}" || exit 1

          # Build one argument array. Never interpolate a possibly-empty array
          # as "${arr[@]:-}": that yields a single empty-string argument, which
          # devto-cli passes to globby as a pattern and which then matches far
          # more than the batch.
          args=("${files[@]}" -r "${GITHUB_REPOSITORY}" -b "${GITHUB_REF_NAME}")
          if [ "${RECONCILE:-false}" = "true" ]; then
            # Matches local articles to remote ones by title and adopts their id
            # instead of creating duplicates.
            args+=(--reconcile)
          fi

          # One invocation for the whole batch. devto-cli fetches the full remote
          # article list once per run, throttles writes internally (30 updates /
          # 30s, 10 creates / 30s) and retries 429s, so per-file loops with
          # sleeps only multiply the remote fetches.
          echo "Pushing ${#files[@]} article(s)."

          # Do NOT let a partial failure end the step here. devto-cli writes the
          # id/date back into each file as that article succeeds, so a batch
          # where one article 429s still has ids on disk for all the others.
          # Letting `set -e` abort now would skip the commit step below and throw
          # those ids away, and the next run would have to --reconcile them back
          # by title. Record the status instead and fail the job after the
          # writeback has been committed.
          set +e
          dev push "${args[@]}"
          push_status=$?
          set -e
          echo "status=${push_status}" >> "$GITHUB_OUTPUT"
          if [ "$push_status" -ne 0 ]; then
            echo "::warning::dev push exited ${push_status}. Committing the ids that did come back before failing the job."
          fi

      # Gated on the push having actually run rather than on it having
      # succeeded, so a batch where some articles failed still commits the ids
      # of the ones that did not. An empty `status` means `dev push` was never
      # reached (no articles, missing token, id precheck failed), and then there
      # is nothing to write back.
      - name: Commit and push frontmatter and asset-version changes
        if: ${{ !cancelled() && steps.publish.outputs.status != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Two sources of change here: the id/date devto-cli writes back, and
          # the ?v= tokens bump_asset_versions.py rewrote during collection.
          git add -- ':(glob)articles/*.md'
          if git diff --cached --quiet; then
            echo "No frontmatter changes to commit."
            exit 0
          fi

          git commit -m "chore: update article metadata from dev.to [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/${GITHUB_REF_NAME}."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the metadata commit after 3 attempts."
          exit 1

      # The push failure is surfaced here rather than in the step that ran it,
      # so that the metadata commit above happens first.
      - name: Fail if the dev.to push reported errors
        if: ${{ !cancelled() && steps.publish.outputs.status != '' && steps.publish.outputs.status != '0' }}
        run: |
          echo "::error::dev push exited with ${{ steps.publish.outputs.status }}. \
          Articles that succeeded kept their ids and were committed. \
          Re-run this workflow with reconcile=true to adopt the rest by title."
          exit 1
