version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Picks up both requirements.txt and requirements-images.txt. Both are pinned
  # with `==`; without an exact pin there is no constraint for Dependabot to
  # raise and it never opens a PR.
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
