t x="125.000000" y="0.000000" width="305.000000" height="82.000000" stroke="#b45309" fill="#fef3c7" style="stroke-width:2;" /></g><text x="277.500000" y="38.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="277.500000" dy="0.000000">Original request</tspan><tspan x="277.500000" dy="18.500000">HTTP method + URI + headers + body</tspan></text></g><g class="UzE= step"><g class="shape" ><rect x="86.000000" y="182.000000" width="382.000000" height="82.000000" stroke="#1d4ed8" fill="#dbeafe" style="stroke-width:2;" /></g><text x="277.000000" y="220.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="277.000000" dy="0.000000">1. Canonical Request</tspan><tspan x="277.000000" dy="18.500000">= request normalized into a deterministic string</tspan></text></g><g class="UzI= step"><g class="shape" ><rect x="0.000000" y="364.000000" width="554.000000" height="82.000000" stroke="#1d4ed8" fill="#dbeafe" style="stroke-width:2;" /></g><text x="277.000000" y="402.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="277.000000" dy="0.000000">2. StringToSign</tspan><tspan x="277.000000" dy="18.500000">= algorithm + timestamp + Credential Scope + hash of Canonical Request</tspan></text></g><g class="UzM= step"><g class="shape" ><rect x="70.000000" y="546.000000" width="415.000000" height="98.000000" stroke="#1d4ed8" fill="#dbeafe" style="stroke-width:2;" /></g><text x="277.500000" y="584.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="277.500000" dy="0.000000">3. Signing Key</tspan><tspan x="277.500000" dy="17.666667">= kSecret -&gt; kDate -&gt; kRegion -&gt; kService -&gt; kSigning</tspan><tspan x="277.500000" dy="17.666667">derived in stages via HMAC</tspan></text></g><g class="UzQ= step"><g class="shape" ><rect x="72.000000" y="744.000000" width="411.000000" height="82.000000" stroke="#1d4ed8" fill="#dbeafe" style="stroke-width:2;" /></g><text x="277.500000" y="782.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="277.500000" dy="0.000000">4. Signature</tspan><tspan x="277.500000" dy="18.500000">= HMAC-SHA256 over StringToSign with Signing Key</tspan></text></g><g class="QXV0aA== auth"><g class="shape" ><rect x="12.000000" y="926.000000" width="530.000000" height="82.000000" stroke="#16a34a" fill="#dcfce7" style="stroke-width:2;" /></g><text x="277.000000" y="964.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="277.000000" dy="0.000000">Sent in the Authorization header</tspan><tspan x="277.000000" dy="18.500000">AWS4-HMAC-SHA256 Credential=..., SignedHeaders=..., Signature=...</tspan></text></g><g class="KFIgLSZndDsgUzEpWzBd"><marker id="mk-d2-2182957186-3488378134" markerWidth="10.000000" markerHeight="12.000000" refX="7.000000" refY="6.000000" viewBox="0.000000 0.000000 10.000000 12.000000" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0.000000,0.000000 10.000000,6.000000 0.000000,12.000000" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 277.000000 84.000000 C 277.000000 122.000000 277.000000 142.000000 277.000000 178.000000" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2182957186-3488378134)" mask="url(#d2-2182957186)" /></g><g class="KFMxIC0mZ3Q7IFMyKVswXQ=="><path d="M 277.000000 266.000000 C 277.000000 304.000000 277.000000 324.000000 277.000000 360.000000" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2182957186-3488378134)" mask="url(#d2-2182957186)" /></g><g class="KFMyIC0mZ3Q7IFMzKVswXQ=="><path d="M 277.000000 448.000000 C 277.000000 486.000000 277.000000 506.000000 277.000000 542.000000" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" 